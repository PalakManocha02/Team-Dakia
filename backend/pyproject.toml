[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcing-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "sqlalchemy>=2,<3", "httpx>=0.27,<1", "google-genai>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["packs/*.json", "providers/fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
